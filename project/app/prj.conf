# Common configurations for all boards

# General
CONFIG_HW_ID_LIBRARY=y
CONFIG_ASSERT=y

# ADC
CONFIG_ADC=y

# Logging
CONFIG_LOG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_NATIVE=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DNS_RESOLVER=y

# ZBus
CONFIG_ZBUS=y

# Zephyr state framework
CONFIG_SMF=y

# MQTT (raw Zephyr MQTT client)
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=300
CONFIG_MQTT_CLEAN_SESSION=y

# TLS credentials
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_SAMPLE_TRANSPORT_SEC_TAG=955

# Broker
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_HOSTNAME="***REMOVED***.s1.eu.hivemq.cloud"
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_USERNAME="device1"
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_PASSWORD="***REMOVED***"

# JSON
CONFIG_CJSON_LIB=y

# Timestamp
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_AUTO_UPDATE=y

# AT monitor heap for modem notifications (%XTIME etc.)
CONFIG_AT_MONITOR_HEAP_SIZE=512

# Payload buffer size (JSON state)
CONFIG_MQTT_SAMPLE_PAYLOAD_CHANNEL_STRING_MAX_SIZE=256

# TF-M
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_HW_STACK_PROTECTION=y
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y
CONFIG_PICOLIBC=y
CONFIG_DK_LIBRARY=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Modem trace
CONFIG_NRF_MODEM_LIB_TRACE=n


# LED
CONFIG_MQTT_SAMPLE_LED=n

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Zephyr NET Connection Manager and Connectivity layer.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_NRF_MODEM_LIB_NET_IF=y

# Use NB-IoT instead of LTE-M
CONFIG_LTE_MODE_PREFERENCE_NBIOT=y
