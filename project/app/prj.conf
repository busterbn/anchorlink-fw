# Common configurations for all boards

# General
CONFIG_HW_ID_LIBRARY=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y

# ADC
CONFIG_ADC=y

# GPIO + input (buttons via gpio-keys)
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# Logging
CONFIG_LOG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_NATIVE=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DNS_RESOLVER=y

# ZBus
CONFIG_ZBUS=y

# Persistent storage (relay state across reboots).
# Enabling SETTINGS_NVS makes the partition manager carve a 16 KB
# settings_storage partition out of flash, shrinking both MCUboot slots.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000

# Zephyr state framework
CONFIG_SMF=y

# Hardware watchdog (reboots if MQTT unreachable for >30 min, or on a hang)
CONFIG_WATCHDOG=y

# MQTT (raw Zephyr MQTT client)
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=300
CONFIG_MQTT_CLEAN_SESSION=y

# TLS credentials
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_SAMPLE_TRANSPORT_SEC_TAG=955

# Broker
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_HOSTNAME="***REMOVED***.s1.eu.hivemq.cloud"
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_PASSWORD="***REMOVED***"

# Timestamp (kept for log timestamps)
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_AUTO_UPDATE=y

# AT monitor heap for modem notifications (%XTIME etc.)
CONFIG_AT_MONITOR_HEAP_SIZE=512

# TF-M
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_HW_STACK_PROTECTION=y
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y
CONFIG_PICOLIBC=y
CONFIG_DK_LIBRARY=y

# FPU (required for GNSS distance math)
CONFIG_FPU=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Modem trace
CONFIG_NRF_MODEM_LIB_TRACE=n


# LED
CONFIG_MQTT_SAMPLE_LED=n

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Zephyr NET Connection Manager and Connectivity layer.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_NRF_MODEM_LIB_NET_IF=y

# Use NB-IoT instead of LTE-M
# CONFIG_LTE_MODE_PREFERENCE_NBIOT=y

# --- Memfault ---
CONFIG_MEMFAULT=y

# Only used for FOTA: disable the hourly metrics/coredump upload over HTTPS
CONFIG_MEMFAULT_HTTP_PERIODIC_UPLOAD=n
CONFIG_MEMFAULT_NCS_PROJECT_KEY="***REMOVED***"
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y

# Memfault's HTTP/OTA code uses malloc, so a heap is required.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Modem info library so Memfault can collect LTE metrics
CONFIG_MODEM_INFO=y

# Memfault FOTA over HTTP using the NCS downloader
CONFIG_MEMFAULT_FOTA=y
CONFIG_MEMFAULT_FOTA_CLI_CMD=y

# --- OTA / DFU (NCS >= 3.0 downloader API) ---
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

CONFIG_FOTA_DOWNLOAD=y
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=400
CONFIG_DOWNLOADER_STACK_SIZE=1600
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y

# Runtime log level filtering (so we can `log enable dbg mflt` in shell)
CONFIG_LOG_RUNTIME_FILTERING=y

CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="1.2.4"