workflow:
  rules:
    - if: '$CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"

stages:
  - build-image
  - build

build-docker-image:
  stage: build-image
  image: docker:latest
  resource_group: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --build-arg ACCEPT_JLINK_LICENSE=1 -t $CI_REGISTRY_IMAGE/build-env:latest .
    - docker push $CI_REGISTRY_IMAGE/build-env:latest
  rules:
    - changes:
        - Dockerfile
        - justfile
    - if: '$CI_PIPELINE_SOURCE == "web"'

build:
  stage: build
  image: docker:latest
  resource_group: production
  variables:
    GIT_DEPTH: "0"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE/build-env:latest || docker build --build-arg ACCEPT_JLINK_LICENSE=1 -t $CI_REGISTRY_IMAGE/build-env:latest . && docker push $CI_REGISTRY_IMAGE/build-env:latest
  script:
    - ./scripts/gitlab-ci/add_release_version.sh
    - docker run --privileged --rm -v $(pwd):/workdir -e CI_COMMIT_TAG=$CI_COMMIT_TAG $CI_REGISTRY_IMAGE/build-env:latest 'cp -a /build-env/.venv /build-env/.west /build-env/deps /workdir/ && just init && ./scripts/gitlab-ci/build_release.sh'
    - ./scripts/gitlab-ci/create_readme.sh
  artifacts:
    paths:
      - artifacts
    when: on_success
    expire_in: 1 year

